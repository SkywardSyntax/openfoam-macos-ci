name: Build OpenFOAM.app for macOS

on:
  workflow_dispatch:
    inputs:
      openfoam_version:
        description: 'OpenFOAM ESI tag to build (e.g. v2606)'
        required: false
        default: 'v2606'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'

jobs:
  build:
    runs-on: macos-15   # Apple Silicon (arm64) runner
    timeout-minutes: 300
    env:
      OPENFOAM_TAG: ${{ github.event.inputs.openfoam_version || 'v2606' }}
      APP_NAME: OpenFOAM-v2606
      VOLUME_NAME: OpenFOAM-Build
      FOAM_CACHE_FILE: /Users/runner/foam-build-cache.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -m
          sw_vers
          brew --version

      - name: Install build dependencies (Homebrew)
        run: |
          brew install open-mpi fftw scotch cgal boost gmp mpfr libomp

      - name: Restore built-tree cache
        id: foam-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FOAM_CACHE_FILE }}
          key: foam-build-${{ env.OPENFOAM_TAG }}-${{ hashFiles('scripts/configure.sh') }}-v1
          save-always: true

      - name: Create case-sensitive build volume
        run: |
          hdiutil create -size 40g -fs 'Case-sensitive APFS' -volname "$VOLUME_NAME" build.sparseimage
          hdiutil attach build.sparseimage
          echo "FOAM_SRC_DIR=/Volumes/$VOLUME_NAME/OpenFOAM-${{ env.OPENFOAM_TAG }}" >> "$GITHUB_ENV"

      - name: Restore built tree from cache
        if: steps.foam-cache.outputs.cache-hit == 'true'
        run: |
          echo "Cache hit — extracting cached built tree instead of rebuilding."
          tar xzf "$FOAM_CACHE_FILE" -C "/Volumes/$VOLUME_NAME"
          ls "$FOAM_SRC_DIR"

      - name: Clone OpenFOAM source
        if: steps.foam-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "OpenFOAM-${OPENFOAM_TAG}" --depth 1 \
            https://gitlab.com/openfoam/core/openfoam.git \
            "$FOAM_SRC_DIR"

      - name: Configure for macOS + Homebrew
        if: steps.foam-cache.outputs.cache-hit != 'true'
        run: |
          cd "$FOAM_SRC_DIR"
          "$GITHUB_WORKSPACE/scripts/configure.sh"

      - name: Build (Allwmake)
        if: steps.foam-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          cd "$FOAM_SRC_DIR"
          echo "MARKER: cd ok"
          set +e
          source etc/bashrc
          rc=$?
          set -e
          echo "MARKER: source etc/bashrc rc=$rc"
          foamSystemCheck
          echo "MARKER: foamSystemCheck ok"
          ./Allwmake -j -log="$GITHUB_WORKSPACE/allwmake.log"

      - name: Upload build log (always, for debugging)
        if: always() && steps.foam-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allwmake-log
          path: allwmake.log
          retention-days: 14

      - name: Save built tree to cache file
        if: steps.foam-cache.outputs.cache-hit != 'true'
        run: |
          tar czf "$FOAM_CACHE_FILE" \
            --exclude='OpenFOAM-*/build' \
            --exclude='OpenFOAM-*/.git' \
            -C "/Volumes/$VOLUME_NAME" "OpenFOAM-${OPENFOAM_TAG}"
          ls -lh "$FOAM_CACHE_FILE"

      - name: Smoke test (blockMesh / simpleFoam presence + tutorial run)
        run: |
          set -x
          cd "$FOAM_SRC_DIR"
          source etc/bashrc
          echo "MARKER: sourced bashrc, PATH=$PATH"
          missing=0
          for b in blockMesh simpleFoam decomposePar; do
            if command -v "$b" >/dev/null 2>&1; then
              echo "FOUND: $b -> $(command -v "$b")"
            else
              echo "MISSING: $b"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "MARKER: all binaries present"
          run_dir=$(mktemp -d)
          cp -r "$FOAM_SRC_DIR/tutorials/incompressible/simpleFoam/pitzDaily" "$run_dir/case"
          cd "$run_dir/case"
          blockMesh
          echo "MARKER: blockMesh ok"
          simpleFoam -postProcess -latestTime -func writeCellCentres || true
          echo "Smoke test OK"

      - name: Package .app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          FOAM_SRC_DIR="$FOAM_SRC_DIR" APP_NAME="$APP_NAME" OUTPUT_DIR="$GITHUB_WORKSPACE/dist" \
            "$GITHUB_WORKSPACE/scripts/package-app.sh"

      - name: Zip .app
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          zip -r --symlinks "${APP_NAME}-macos-arm64.zip" "${APP_NAME}.app"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-arm64
          path: dist/${{ env.APP_NAME }}-macos-arm64.zip
          retention-days: 30

      - name: Eject build volume
        if: always()
        run: hdiutil eject "/Volumes/$VOLUME_NAME" || true
