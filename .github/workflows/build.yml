name: Build OpenFOAM.app for macOS

on:
  workflow_dispatch:
    inputs:
      openfoam_version:
        description: 'OpenFOAM ESI tag to build (e.g. v2606)'
        required: false
        default: 'v2606'
  push:
    branches: [main]
    paths:
      # Deliberately not 'scripts/**': scripts/latest-openfoam-tag.sh only
      # feeds the release watcher, and editing it must not kick off a
      # multi-hour macOS build.
      - '.github/workflows/build.yml'
      - 'scripts/configure.sh'
      - 'scripts/package-app.sh'
      - 'scripts/bundle-deps.sh'
      - 'scripts/test-app.sh'
      - 'icon/**'

# One build per OpenFOAM version. The hourly release watcher also refuses to
# dispatch while a build is running, but this is the backstop that keeps a
# manual re-dispatch from running the same multi-hour build twice over.
concurrency:
  group: build-${{ github.event.inputs.openfoam_version || 'v2606' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15   # Apple Silicon (arm64) runner
    timeout-minutes: 300
    permissions:
      contents: write   # needed to publish the release
      issues: write     # file/close the build-failure issue the watcher reads
    env:
      OPENFOAM_TAG: ${{ github.event.inputs.openfoam_version || 'v2606' }}
      APP_NAME: OpenFOAM-${{ github.event.inputs.openfoam_version || 'v2606' }}
      VOLUME_NAME: OpenFOAM-Build
      FOAM_CACHE_FILE: /Users/runner/foam-build-cache.tar.gz
      PARAVIEW_VERSION: 6.1.1
      PARAVIEW_SERIES: v6.1
      PARAVIEW_DMG_NAME: ParaView-6.1.1-MPI-OSX11.0-Python3.12-arm64.dmg
      PARAVIEW_DMG: /Users/runner/paraview.dmg
      PARAVIEW_MNT: /Users/runner/pvmnt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -m
          sw_vers
          brew --version

      - name: Install build dependencies (Homebrew)
        run: |
          brew install open-mpi fftw scotch cgal boost gmp mpfr libomp

      - name: Restore built-tree cache
        id: foam-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FOAM_CACHE_FILE }}
          key: foam-build-${{ env.OPENFOAM_TAG }}-${{ hashFiles('scripts/configure.sh') }}-v1

      - name: Create case-sensitive build volume
        run: |
          hdiutil create -size 40g -fs 'Case-sensitive APFS' -volname "$VOLUME_NAME" build.sparseimage
          hdiutil attach build.sparseimage
          echo "FOAM_SRC_DIR=/Volumes/$VOLUME_NAME/OpenFOAM-${{ env.OPENFOAM_TAG }}" >> "$GITHUB_ENV"

      - name: Restore built tree from cache
        if: steps.foam-cache.outputs.cache-hit == 'true'
        run: |
          echo "Cache hit — extracting cached built tree instead of rebuilding."
          tar xzf "$FOAM_CACHE_FILE" -C "/Volumes/$VOLUME_NAME"
          ls "$FOAM_SRC_DIR"

      - name: Clone OpenFOAM source
        if: steps.foam-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "OpenFOAM-${OPENFOAM_TAG}" --depth 1 \
            https://gitlab.com/openfoam/core/openfoam.git \
            "$FOAM_SRC_DIR"

      - name: Configure for macOS + Homebrew
        if: steps.foam-cache.outputs.cache-hit != 'true'
        run: |
          cd "$FOAM_SRC_DIR"
          "$GITHUB_WORKSPACE/scripts/configure.sh"

      - name: Build (Allwmake)
        id: allwmake
        if: steps.foam-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          cd "$FOAM_SRC_DIR"
          echo "MARKER: cd ok"
          set +e
          source etc/bashrc
          rc=$?
          set -e
          echo "MARKER: source etc/bashrc rc=$rc"
          foamSystemCheck
          echo "MARKER: foamSystemCheck ok"
          ./Allwmake -j -log="$GITHUB_WORKSPACE/allwmake.log"

      - name: Upload build log (always, for debugging)
        if: always() && steps.foam-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allwmake-log
          path: allwmake.log
          retention-days: 14

      - name: Create cache tarball from built tree
        if: always() && steps.foam-cache.outputs.cache-hit != 'true' && steps.allwmake.outcome == 'success'
        run: |
          tar czf "$FOAM_CACHE_FILE" \
            --exclude='OpenFOAM-*/build' \
            --exclude='OpenFOAM-*/.git' \
            -C "/Volumes/$VOLUME_NAME" "OpenFOAM-${OPENFOAM_TAG}"
          ls -lh "$FOAM_CACHE_FILE"

      - name: Save built-tree cache
        if: always() && steps.foam-cache.outputs.cache-hit != 'true' && steps.allwmake.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FOAM_CACHE_FILE }}
          key: foam-build-${{ env.OPENFOAM_TAG }}-${{ hashFiles('scripts/configure.sh') }}-v1

      - name: Restore ParaView download cache
        id: pv-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PARAVIEW_DMG }}
          key: paraview-${{ env.PARAVIEW_VERSION }}-arm64

      - name: Download ParaView (official prebuilt arm64 binary)
        if: steps.pv-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o "$PARAVIEW_DMG" \
            "https://www.paraview.org/paraview-downloads/download.php?submit=Download&version=${PARAVIEW_SERIES}&type=binary&os=macOS&downloadFile=${PARAVIEW_DMG_NAME}"
          ls -lh "$PARAVIEW_DMG"

      - name: Save ParaView download cache
        if: steps.pv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PARAVIEW_DMG }}
          key: paraview-${{ env.PARAVIEW_VERSION }}-arm64

      - name: Mount ParaView image
        run: |
          mkdir -p "$PARAVIEW_MNT"
          # The ParaView image carries a license agreement, which blocks a
          # non-interactive attach unless acceptance is piped in.
          yes | hdiutil attach "$PARAVIEW_DMG" \
            -nobrowse -noverify -noautoopen -mountpoint "$PARAVIEW_MNT" >/dev/null
          PV_APP="$(find "$PARAVIEW_MNT" -maxdepth 1 -name 'ParaView*.app' | head -1)"
          [ -n "$PV_APP" ] || { echo "No ParaView.app found in image"; exit 1; }
          echo "PARAVIEW_APP=$PV_APP" >> "$GITHUB_ENV"
          echo "Found $PV_APP"

      - name: Smoke test (blockMesh / simpleFoam presence + tutorial run)
        run: |
          set -x
          cd "$FOAM_SRC_DIR"
          set +e
          source etc/bashrc
          rc=$?
          set -e
          echo "MARKER: sourced bashrc rc=$rc, PATH=$PATH"
          missing=0
          for b in blockMesh simpleFoam decomposePar; do
            if command -v "$b" >/dev/null 2>&1; then
              echo "FOUND: $b -> $(command -v "$b")"
            else
              echo "MISSING: $b"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "MARKER: all binaries present"
          run_dir=$(mktemp -d)
          cp -r "$FOAM_SRC_DIR/tutorials/incompressible/simpleFoam/pitzDaily" "$run_dir/case"
          cd "$run_dir/case"
          blockMesh
          echo "MARKER: blockMesh ok"
          simpleFoam -postProcess -latestTime -func writeCellCentres || true
          echo "Smoke test OK"

      - name: Package .app (with bundled ParaView)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          FOAM_SRC_DIR="$FOAM_SRC_DIR" APP_NAME="$APP_NAME" OUTPUT_DIR="$GITHUB_WORKSPACE/dist" \
          PARAVIEW_APP="$PARAVIEW_APP" \
            "$GITHUB_WORKSPACE/scripts/package-app.sh"
          du -sh "$GITHUB_WORKSPACE/dist/${APP_NAME}.app"

      - name: Zip .app
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          zip -qr --symlinks "${APP_NAME}-macos-arm64.zip" "${APP_NAME}.app"
          ls -lh "${APP_NAME}-macos-arm64.zip"

      # Test what a user actually downloads, unpacked somewhere else. That
      # covers the zip round-trip (pvbin and lnInclude are symlinks) and proves
      # the app is relocatable: everything inside has to resolve through
      # @loader_path and $_res, never the directory it happened to be built in.
      # The original is removed rather than kept -- the app is 2.3G and the
      # runner does not have room for two copies. Only the zip is published.
      - name: Unpack the release zip to a clean location
        run: |
          rm -rf /Users/runner/installed && mkdir -p /Users/runner/installed
          cd /Users/runner/installed
          unzip -q "$GITHUB_WORKSPACE/dist/${APP_NAME}-macos-arm64.zip"
          rm -rf "$GITHUB_WORKSPACE/dist/${APP_NAME}.app"
          du -sh "/Users/runner/installed/${APP_NAME}.app"
          df -h /Users/runner | tail -1

      - name: Hide Homebrew
        run: sudo mv /opt/homebrew /opt/homebrew-hidden

      # The runner has Homebrew installed, so without this every check could
      # pass by quietly falling back to it. scripts/test-app.sh exits non-zero
      # if any required check fails, so it is the gate on its own.
      - name: Acceptance suite (no Homebrew, relocated app)
        run: |
          APP="/Users/runner/installed/${APP_NAME}.app" APP_NAME="$APP_NAME" \
            "$GITHUB_WORKSPACE/scripts/test-app.sh"

      - name: Restore Homebrew
        if: always()
        run: |
          if [ -d /opt/homebrew-hidden ]; then
            sudo mv /opt/homebrew-hidden /opt/homebrew
            echo "Homebrew restored."
          else
            echo "Nothing to restore (it was never hidden)."
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-arm64
          path: dist/${{ env.APP_NAME }}-macos-arm64.zip
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="OpenFOAM-${OPENFOAM_TAG}"
          ASSET="dist/${APP_NAME}-macos-arm64.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing asset."
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "OpenFOAM ${OPENFOAM_TAG} for macOS (Apple Silicon)" \
              --notes "Native OpenFOAM ${OPENFOAM_TAG} for Apple Silicon macOS, built from upstream source on a \`macos-15\` runner.

          **Install**
          1. Download and unzip \`${APP_NAME}-macos-arm64.zip\`
          2. Move \`${APP_NAME}.app\` to \`/Applications\`

          That's it — **no Homebrew, no dependencies to install.** Every third-party library is bundled inside the app and its install names rewritten to load from there, so nothing is read from \`/opt/homebrew\`. Each build verifies this by deleting Homebrew from the runner outright and re-running the solvers.

          Double-clicking the app opens a Terminal with the OpenFOAM environment sourced, in your run directory. It bundles the full \`wmake\` toolchain plus the third-party headers, so you can compile custom solvers against it (that path also needs Apple's Command Line Tools — \`xcode-select --install\` — for the compiler itself, which is the one thing an app cannot ship).

          **ParaView ${PARAVIEW_VERSION} is bundled** (official prebuilt arm64 build, not recompiled). From a case directory run \`paraFoam -builtin\` to open it, or use \`pvpython\`/\`pvbatch\` for scripted post-processing. Only ParaView's front-end tools are placed on \`PATH\` — its bundled MPICH \`mpiexec\` is deliberately kept off, so it cannot shadow the OpenMPI that OpenFOAM's parallel runs use.

          Built by [\`.github/workflows/build.yml\`](https://github.com/${{ github.repository }}/blob/main/.github/workflows/build.yml) from commit ${{ github.sha }}."
          fi
          gh release view "$TAG" --json url --jq .url

      - name: File a build-failure issue (unattended runs have nobody watching)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Build failed: OpenFOAM-${OPENFOAM_TAG}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # The watcher skips any version with an open issue under this label,
          # so creating it here is also what stops an hourly retry loop from
          # burning a multi-hour macOS build on a version that cannot succeed.
          gh label create build-failure --color B60205 \
            --description "An OpenFOAM build failed; the release watcher will not retry" \
            >/dev/null 2>&1 || true

          NUM="$(gh issue list --state open --label build-failure --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")"

          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Another attempt failed: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label build-failure --body "\
          The build for \`OpenFOAM-${OPENFOAM_TAG}\` failed.

          - Run: $RUN_URL
          - Triggered by: \`${{ github.event_name }}\`
          - Commit: ${{ github.sha }}

          The hourly release watcher will **not** retry this version while this
          issue is open. Fix the build (or decide to skip the version), then
          close this issue to let the next hourly tick try again."
          fi

      - name: Close the failure issue now that this version builds
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Build failed: OpenFOAM-${OPENFOAM_TAG}"
          NUM="$(gh issue list --state open --label build-failure --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null || true)"
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Fixed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} published the release."
          fi

      - name: Eject build volume and ParaView image
        if: always()
        run: |
          hdiutil eject "/Volumes/$VOLUME_NAME" || true
          hdiutil detach "$PARAVIEW_MNT" || true
