<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1E3E63"/>
      <stop offset="50%"  stop-color="#122740"/>
      <stop offset="100%" stop-color="#080E18"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8FBEE8" stop-opacity="0.40"/>
      <stop offset="30%"  stop-color="#8FBEE8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38"/>
    </linearGradient>

    <linearGradient id="vFast" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="950" y2="0">
      <stop offset="0%"   stop-color="#1D4ED8" stop-opacity="0.30"/>
      <stop offset="28%"  stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#F0FDFF" stop-opacity="1"/>
      <stop offset="72%"  stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="vMid" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="950" y2="0">
      <stop offset="0%"   stop-color="#1D4ED8" stop-opacity="0.22"/>
      <stop offset="32%"  stop-color="#22D3EE" stop-opacity="0.72"/>
      <stop offset="55%"  stop-color="#A5F3FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="vSlow" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="950" y2="0">
      <stop offset="0%"   stop-color="#1E40AF" stop-opacity="0.16"/>
      <stop offset="45%"  stop-color="#0EA5E9" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.07"/>
    </linearGradient>

    <linearGradient id="bodyPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFAE55"/>
      <stop offset="22%"  stop-color="#F0801F"/>
      <stop offset="62%"  stop-color="#BF5700"/>
      <stop offset="100%" stop-color="#6E3000"/>
    </linearGradient>

    <linearGradient id="podPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C75E08"/>
      <stop offset="100%" stop-color="#5E2900"/>
    </linearGradient>

    <linearGradient id="canopyGlass" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#EAF9FF" stop-opacity="0.97"/>
      <stop offset="50%"  stop-color="#86BEE0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22485F" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0A1B2C" stop-opacity="0"/>
      <stop offset="14%"  stop-color="#0A1B2C" stop-opacity="0.82"/>
      <stop offset="86%"  stop-color="#0A1B2C" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0A1B2C" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.52">
      <stop offset="0%"   stop-color="#5BC8F5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5BC8F5" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="squircle">
      <rect x="76" y="76" width="872" height="872" rx="196" ry="196"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- ===== streamlines: flow left -> right, compressing over the canopy ===== -->
    <g fill="none" stroke-linecap="round">
      <path d="M 40 300 C 300 296, 660 292, 1000 300" stroke="url(#vSlow)" stroke-width="10"/>
      <path d="M 40 352 C 280 348, 420 312, 524 300 C 660 286, 840 344, 1000 358"
            stroke="url(#vSlow)" stroke-width="11"/>
      <path d="M 40 404 C 260 402, 400 348, 522 334 C 668 318, 850 396, 1000 410"
            stroke="url(#vMid)" stroke-width="12"/>
      <path d="M 40 458 C 246 456, 386 382, 520 366 C 672 348, 856 448, 1000 464"
            stroke="url(#vFast)" stroke-width="14"/>
      <path d="M 40 512 C 234 510, 372 414, 518 396 C 676 378, 862 502, 1000 520"
            stroke="url(#vFast)" stroke-width="15"/>
      <path d="M 40 566 C 222 564, 356 446, 516 426 C 680 406, 868 556, 1000 576"
            stroke="url(#vMid)" stroke-width="13"/>
    </g>

    <!-- ===== solar car: side profile, nose left ===== -->
    <g transform="translate(0,26)">
      <ellipse cx="516" cy="692" rx="316" ry="16" fill="#000000" opacity="0.5"/>

      <!-- wheel fairing pods -->
      <path d="M 268 612 C 268 566, 384 566, 384 612 L 384 672 L 268 672 Z" fill="url(#podPaint)"/>
      <path d="M 648 612 C 648 568, 760 568, 760 612 L 760 672 L 648 672 Z" fill="url(#podPaint)"/>

      <!-- main body: long + low -->
      <path d="M 170 632
               C 170 588, 226 556, 318 543
               C 400 531, 470 524, 540 522
               C 626 519, 712 526, 782 542
               C 842 556, 872 580, 872 612
               C 872 634, 852 646, 820 648
               L 214 648
               C 184 648, 170 642, 170 632 Z"
            fill="url(#bodyPaint)"/>

      <!-- solar array deck -->
      <path d="M 300 548 C 420 528, 640 524, 790 549 L 790 566 C 640 541, 420 545, 300 565 Z"
            fill="url(#deck)"/>
      <g stroke="#22384C" stroke-width="3" opacity="0.55">
        <line x1="368" y1="540" x2="366" y2="558"/>
        <line x1="436" y1="532" x2="435" y2="550"/>
        <line x1="504" y1="527" x2="504" y2="545"/>
        <line x1="572" y1="525" x2="573" y2="543"/>
        <line x1="640" y1="527" x2="642" y2="545"/>
        <line x1="708" y1="533" x2="711" y2="551"/>
        <line x1="762" y1="540" x2="766" y2="557"/>
      </g>

      <!-- canopy bubble -->
      <path d="M 452 524 C 466 462, 556 452, 596 506 C 604 517, 610 521, 616 523 Z"
            fill="url(#canopyGlass)"/>
      <path d="M 468 518 C 482 476, 538 468, 566 494 Z" fill="#FFFFFF" opacity="0.45"/>

      <!-- nose highlight -->
      <path d="M 184 612 C 192 578, 236 558, 310 548"
            fill="none" stroke="#FFC98C" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

      <!-- wheels -->
      <circle cx="326" cy="666" r="38" fill="#0A1018"/>
      <circle cx="704" cy="666" r="38" fill="#0A1018"/>
      <circle cx="326" cy="666" r="14" fill="#38495A"/>
      <circle cx="704" cy="666" r="14" fill="#38495A"/>
    </g>

    <!-- underbody flow + wake, anchors the lower third -->
    <g fill="none" stroke-linecap="round">
      <path d="M 40 742 C 300 742, 640 746, 1000 744"
            stroke="url(#vMid)" stroke-width="11"/>
      <path d="M 40 800 C 320 800, 660 802, 1000 800"
            stroke="url(#vSlow)" stroke-width="9"/>
    </g>

    <rect width="1024" height="1024" fill="url(#rim)"/>
  </g>

  <rect x="76" y="76" width="872" height="872" rx="196" ry="196"
        fill="none" stroke="#A9CFF0" stroke-opacity="0.24" stroke-width="3"/>
</svg>
